<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto — ByteCore</title>
    <meta name="description" content="Formulario para registrar un nuevo producto en ByteCore.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Barra superior -->
    <div class="top-bar py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white mb-0" href="index.html">Byte<span>Core</span></a>
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Volver al catálogo
            </a>
        </div>
    </div>

    <!-- Formulario -->
    <div class="container mt-5 mb-5" style="max-width: 680px;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

            <!-- Cabecera de la tarjeta -->
            <div class="card-header py-4" style="background: linear-gradient(90deg, #0f172a 0%, #1e3a5f 100%);">
                <h4 class="mb-0 text-white fw-bold">
                    <i class="bi bi-box-seam me-2"></i>Registrar Nuevo Producto
                </h4>
                <p class="text-white-50 small mb-0 mt-1">Completa los datos para agregar un producto al catálogo.</p>
            </div>

            <div class="card-body p-4">

                <!-- Alerta de respuesta del servidor -->
                <div id="alertaRespuesta" class="alert d-none" role="alert"></div>

                <!-- Formulario -->
                <form id="formProducto">

                    <div class="mb-3">
                        <label for="nombre" class="form-label text-muted small fw-bold">Nombre del Producto</label>
                        <input type="text" class="form-control bg-light border-0 shadow-none" id="nombre"
                               required placeholder="Ej. Mouse Gamer RGB">
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label text-muted small fw-bold">Descripción</label>
                        <textarea class="form-control bg-light border-0 shadow-none" id="descripcion"
                                  rows="3" required placeholder="Detalles del producto..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label text-muted small fw-bold">Precio Regular (Q)</label>
                            <input type="number" step="0.01" class="form-control bg-light border-0 shadow-none"
                                   id="precio" required placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoriaSelect" class="form-label text-muted small fw-bold">Categoría</label>
                            <select class="form-select bg-light border-0 shadow-none" id="categoriaSelect" required>
                                <option value="">Seleccione una...</option>
                                <option value="1|Electrónica">Electrónica</option>
                                <option value="2|Ropa">Ropa</option>
                                <option value="3|Hogar">Hogar</option>
                                <option value="4|Procesadores">Procesadores</option>
                                <option value="5|Tarjetas de Video">Tarjetas de Video</option>
                                <option value="6|Memoria RAM">Memoria RAM</option>
                                <option value="7|Almacenamiento">Almacenamiento</option>
                                <option value="8|Periféricos">Periféricos</option>
                            </select>
                        </div>
                    </div>

                    <!-- Opción de Oferta -->
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="enOferta">
                        <label class="form-check-label" for="enOferta">¿Está en Oferta?</label>
                    </div>

                    <div class="mb-3 d-none" id="contenedorPrecioOferta">
                        <label for="precioOferta" class="form-label text-muted small fw-bold">Precio de Oferta (Q)</label>
                        <input type="number" step="0.01" class="form-control bg-light border-0 shadow-none"
                               id="precioOferta" placeholder="0.00">
                    </div>

                    <div class="mb-4">
                        <label for="imagen" class="form-label text-muted small fw-bold">URL de la Imagen</label>
                        <input type="url" class="form-control bg-light border-0 shadow-none" id="imagen"
                               required value="https://placehold.co/300x200?text=Nuevo+Producto">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-nm btn-lg rounded-pill shadow-sm" id="btnGuardar">
                            <i class="bi bi-cloud-upload me-2"></i>Guardar Producto
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto';

        const formProducto          = document.getElementById('formProducto');
        const checkOferta           = document.getElementById('enOferta');
        const contenedorPrecioOferta = document.getElementById('contenedorPrecioOferta');
        const alertaRespuesta       = document.getElementById('alertaRespuesta');
        const btnGuardar            = document.getElementById('btnGuardar');

        // Mostrar / ocultar campo precio oferta
        checkOferta.addEventListener('change', () => {
            if (checkOferta.checked) {
                contenedorPrecioOferta.classList.remove('d-none');
            } else {
                contenedorPrecioOferta.classList.add('d-none');
                document.getElementById('precioOferta').value = '';
            }
        });

        // Enviar formulario (POST)
        formProducto.addEventListener('submit', async (e) => {
            e.preventDefault();

            const [catId, catNombre] = document.getElementById('categoriaSelect').value.split('|');

            const nuevoProducto = {
                id: 0,
                nombre:          document.getElementById('nombre').value.trim(),
                descripcion:     document.getElementById('descripcion').value.trim(),
                precio:          parseFloat(document.getElementById('precio').value),
                enOferta:        checkOferta.checked,
                precioOferta:    checkOferta.checked ? parseFloat(document.getElementById('precioOferta').value) : null,
                imagen:          document.getElementById('imagen').value.trim(),
                categoriaId:     parseInt(catId),
                categoriaNombre: catNombre
            };

            btnGuardar.disabled = true;
            btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';

            try {
                const response = await fetch(API_URL, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(nuevoProducto)
                });

                if (response.ok) {
                    const resultado = await response.json();
                    mostrarAlerta(`¡Producto "${resultado.nombre}" creado con éxito! (ID: ${resultado.id})`, 'success');
                    formProducto.reset();
                    contenedorPrecioOferta.classList.add('d-none');
                } else {
                    mostrarAlerta('Ocurrió un error al intentar guardar el producto.', 'danger');
                }
            } catch (error) {
                console.error('Error al conectar con la API:', error);
                mostrarAlerta('No se pudo conectar con el servidor.', 'danger');
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Guardar Producto';
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            alertaRespuesta.className = `alert alert-${tipo} d-flex align-items-center gap-2`;
            alertaRespuesta.innerHTML = `<i class="bi bi-${tipo === 'success' ? 'check-circle' : 'exclamation-triangle'}-fill"></i><span>${mensaje}</span>`;
            alertaRespuesta.classList.remove('d-none');
            setTimeout(() => alertaRespuesta.classList.add('d-none'), 5000);
        }
    </script>

</body>

</html>
